name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The lockfile pins ESLint 10; the ESLint 9 leg swaps it in ad hoc (scripts off, cooldown on)
      - run: npm install --no-save --ignore-scripts "eslint@${ESLINT_VERSION}" # zizmor: ignore[adhoc-packages]
        if: matrix.eslint != 10
        env:
          ESLINT_VERSION: ${{ matrix.eslint }}
      - run: npm run typecheck
      - run: npm run lint
        if: matrix.eslint == 10
      - run: npm test
      - run: npm run build
